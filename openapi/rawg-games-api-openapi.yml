openapi: 3.2.0
info:
  title: RAWG Video Database Games API
  description: The largest open video games database.
  version: v1.0
servers:
- url: https://api.rawg.io/api
tags:
- name: Games
paths:
  /games:
    parameters: []
    get:
      operationId: games_list
      summary: Get a list of games
      description: ''
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: search
        in: query
        description: Search query.
        schema:
          type: string
      - name: search_precise
        in: query
        description: Disable fuzziness for the search query.
        schema:
          type: boolean
      - name: search_exact
        in: query
        description: Mark the search query as exact.
        schema:
          type: boolean
      - name: parent_platforms
        in: query
        description: 'Filter by parent platforms, for example: `1,2,3`.'
        schema:
          type: string
      - name: platforms
        in: query
        description: 'Filter by platforms, for example: `4,5`.'
        schema:
          type: string
      - name: stores
        in: query
        description: 'Filter by stores, for example: `5,6`.'
        schema:
          type: string
      - name: developers
        in: query
        description: 'Filter by developers, for example: `1612,18893` or `valve-software,feral-interactive`.'
        schema:
          type: string
      - name: publishers
        in: query
        description: 'Filter by publishers, for example: `354,20987` or `electronic-arts,microsoft-studios`.'
        schema:
          type: string
      - name: genres
        in: query
        description: 'Filter by genres, for example: `4,51` or `action,indie`.'
        schema:
          type: string
      - name: tags
        in: query
        description: 'Filter by tags, for example: `31,7` or `singleplayer,multiplayer`.'
        schema:
          type: string
      - name: creators
        in: query
        description: 'Filter by creators, for example: `78,28` or `cris-velasco,mike-morasky`.'
        schema:
          type: string
      - name: dates
        in: query
        description: 'Filter by a release date, for example: `2010-01-01,2018-12-31.1960-01-01,1969-12-31`.'
        schema:
          type: string
      - name: updated
        in: query
        description: 'Filter by an update date, for example: `2020-12-01,2020-12-31`.'
        schema:
          type: string
      - name: platforms_count
        in: query
        description: 'Filter by platforms count, for example: `1`.'
        schema:
          type: integer
      - name: metacritic
        in: query
        description: 'Filter by a metacritic rating, for example: `80,100`.'
        schema:
          type: string
      - name: exclude_collection
        in: query
        description: 'Exclude games from a particular collection, for example: `123`.'
        schema:
          type: integer
      - name: exclude_additions
        in: query
        description: Exclude additions.
        schema:
          type: boolean
      - name: exclude_parents
        in: query
        description: Exclude games which have additions.
        schema:
          type: boolean
      - name: exclude_game_series
        in: query
        description: Exclude games which included in a game series.
        schema:
          type: boolean
      - name: exclude_stores
        in: query
        description: 'Exclude stores, for example: `5,6`.'
        schema:
          type: string
      - name: ordering
        in: query
        description: 'Available fields: `name`, `released`, `added`, `created`, `updated`, `rating`, `metacritic`. You can reverse the sort order adding a hyphen, for example: `-released`.'
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
      tags:
      - Games
  /games/{game_pk}/additions:
    parameters:
    - name: game_pk
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: games_additions_list
      summary: Get a list of DLC's for the game, GOTY and other editions, companion apps, etc
      description: ''
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
      tags:
      - Games
  /games/{game_pk}/development-team:
    parameters:
    - name: game_pk
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: games_development-team_list
      summary: Get a list of individual creators that were part of the development team
      description: ''
      parameters:
      - name: ordering
        in: query
        description: Which field to use when ordering the results.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/GamePersonList'
      tags:
      - Games
  /games/{game_pk}/game-series:
    parameters:
    - name: game_pk
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: games_game-series_list
      summary: Get a list of games that are part of the same series
      description: ''
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
      tags:
      - Games
  /games/{game_pk}/parent-games:
    parameters:
    - name: game_pk
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: games_parent-games_list
      summary: Get a list of parent games for DLC's and editions
      description: ''
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
      tags:
      - Games
  /games/{game_pk}/screenshots:
    parameters:
    - name: game_pk
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: games_screenshots_list
      summary: Get screenshots for the game
      description: ''
      parameters:
      - name: ordering
        in: query
        description: Which field to use when ordering the results.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScreenShot'
      tags:
      - Games
  /games/{game_pk}/stores:
    parameters:
    - name: game_pk
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: games_stores_list
      summary: Get links to the stores that sell the game
      description: ''
      parameters:
      - name: ordering
        in: query
        description: Which field to use when ordering the results.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameStoreFull'
      tags:
      - Games
  /games/{id}:
    parameters:
    - name: id
      in: path
      description: A unique integer value identifying this Game.
      required: true
      schema:
        type: integer
    get:
      operationId: games_read
      summary: Get details of the game
      description: ''
      parameters:
      - name: id
        in: path
        description: An ID or a slug identifying this Game.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSingle'
      tags:
      - Games
  /games/{id}/achievements:
    parameters:
    - name: id
      in: path
      description: A unique integer value identifying this Game.
      required: true
      schema:
        type: integer
    get:
      operationId: games_achievements_read
      summary: Get a list of game achievements
      description: ''
      parameters:
      - name: id
        in: path
        description: An ID or a slug identifying this Game.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
