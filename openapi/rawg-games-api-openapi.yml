components:
  schemas:
    ScreenShot:
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        image:
          title: Image
          description: An image file with size up to 20 MB.
          type: string
          readOnly: true
          format: uri
        hidden:
          title: Hidden
          description: Set image as hidden or visible.
          type: boolean
          default: false
        width:
          title: Width
          type: integer
          readOnly: true
        height:
          title: Height
          type: integer
          readOnly: true
      example:
        image: '@image.jpg'
        hidden: false
    Reddit:
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        name:
          title: Name
          type: string
          readOnly: true
          minLength: 1
        text:
          title: Text
          type: string
          readOnly: true
          minLength: 1
        image:
          title: Image
          type: string
          format: uri
          readOnly: true
          minLength: 1
        url:
          title: Url
          type: string
          format: uri
          readOnly: true
          minLength: 1
        username:
          title: Username
          type: string
          readOnly: true
          minLength: 1
        username_url:
          title: Username url
          type: string
          format: uri
          readOnly: true
          minLength: 1
        created:
          title: Created
          type: string
          format: date-time
          readOnly: true
    Twitch:
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        external_id:
          title: External id
          type: integer
          readOnly: true
        name:
          title: Name
          type: string
          readOnly: true
          minLength: 1
        description:
          title: Description
          type: string
          readOnly: true
          minLength: 1
        created:
          title: Created
          type: string
          format: date-time
          readOnly: true
        published:
          title: Published
          type: string
          format: date-time
          readOnly: true
        thumbnail:
          title: Thumbnail
          type: string
          format: uri
          readOnly: true
          minLength: 1
        view_count:
          title: View count
          type: integer
          readOnly: true
        language:
          title: Language
          type: string
          readOnly: true
          minLength: 1
    GameSingle:
      required:
      - rating
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        slug:
          title: Slug
          type: string
          format: slug
          pattern: ^[-a-zA-Z0-9_]+$
          readOnly: true
          minLength: 1
        name:
          title: Name
          type: string
          readOnly: true
          minLength: 1
        name_original:
          title: Name original
          type: string
          readOnly: true
          minLength: 1
        description:
          title: Description
          type: string
          readOnly: true
          minLength: 1
        metacritic:
          title: Metacritic
          type: integer
          readOnly: true
        metacritic_platforms:
          type: array
          items:
            $ref: '#/components/schemas/GamePlatformMetacritic'
          readOnly: true
        released:
          title: Released
          type: string
          format: date
          readOnly: true
        tba:
          title: TBA
          type: boolean
          readOnly: true
        updated:
          title: Updated
          type: string
          format: date-time
          readOnly: true
        background_image:
          title: Background image
          type: string
          readOnly: true
          format: uri
        background_image_additional:
          title: Background image additional
          type: string
          readOnly: true
        website:
          title: Website
          type: string
          format: uri
          readOnly: true
          minLength: 1
        rating:
          title: Rating
          type: number
        rating_top:
          title: Rating top
          type: integer
          readOnly: true
        ratings:
          title: Ratings
          type: object
          readOnly: true
        reactions:
          title: Reactions
          type: object
          readOnly: true
        added:
          title: Added
          type: integer
          readOnly: true
        added_by_status:
          title: Added by status
          type: object
          readOnly: true
        playtime:
          title: Playtime
          description: in hours
          type: integer
          readOnly: true
        screenshots_count:
          title: Screenshots count
          type: integer
          readOnly: true
        movies_count:
          title: Movies count
          type: integer
          readOnly: true
        creators_count:
          title: Creators count
          type: integer
          readOnly: true
        achievements_count:
          title: Achievements count
          type: integer
          readOnly: true
        parent_achievements_count:
          title: Parent achievements count
          type: string
          readOnly: true
        reddit_url:
          title: Reddit url
          description: For example "https://www.reddit.com/r/uncharted/" or "uncharted"
          type: string
          readOnly: true
          minLength: 1
        reddit_name:
          title: Reddit name
          type: string
          readOnly: true
          minLength: 1
        reddit_description:
          title: Reddit description
          type: string
          readOnly: true
          minLength: 1
        reddit_logo:
          title: Reddit logo
          type: string
          format: uri
          readOnly: true
          minLength: 1
        reddit_count:
          title: Reddit count
          type: integer
          readOnly: true
        twitch_count:
          title: Twitch count
          type: string
          readOnly: true
        youtube_count:
          title: Youtube count
          type: string
          readOnly: true
        reviews_text_count:
          title: Reviews text count
          type: string
          readOnly: true
        ratings_count:
          title: Ratings count
          type: integer
          readOnly: true
        suggestions_count:
          title: Suggestions count
          type: integer
          readOnly: true
        alternative_names:
          type: array
          items:
            title: Alternative names
            type: string
            maxLength: 200
            minLength: 1
          readOnly: true
        metacritic_url:
          title: Metacritic url
          description: For example "http://www.metacritic.com/game/playstation-4/the-witcher-3-wild-hunt"
          type: string
          readOnly: true
          minLength: 1
        parents_count:
          title: Parents count
          type: integer
          readOnly: true
        additions_count:
          title: Additions count
          type: integer
          readOnly: true
        game_series_count:
          title: Game series count
          type: integer
          readOnly: true
        esrb_rating:
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
            slug:
              type: string
              enum:
              - everyone
              - everyone-10-plus
              - teen
              - mature
              - adults-only
              - rating-pending
            name:
              type: string
              enum:
              - Everyone
              - Everyone 10+
              - Teen
              - Mature
              - Adults Only
              - Rating Pending
        platforms:
          type: array
          items:
            type: object
            properties:
              platform:
                type: object
                properties:
                  id:
                    type: integer
                  slug:
                    type: string
                  name:
                    type: string
              released_at:
                type:
                - string
                - 'null'
              requirements:
                type:
                - object
                - 'null'
                properties:
                  minimum:
                    type: string
                  recommended:
                    type: string
    ParentAchievement:
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        name:
          title: Name
          type: string
          readOnly: true
          minLength: 1
        description:
          title: Description
          type: string
          readOnly: true
          minLength: 1
        image:
          title: Image
          type: string
          readOnly: true
          format: uri
        percent:
          title: Percent
          type: string
          format: decimal
          readOnly: true
    Game:
      required:
      - rating
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        slug:
          title: Slug
          type: string
          format: slug
          pattern: ^[-a-zA-Z0-9_]+$
          readOnly: true
          minLength: 1
        name:
          title: Name
          type: string
          readOnly: true
          minLength: 1
        released:
          title: Released
          type: string
          format: date
          readOnly: true
        tba:
          title: TBA
          type: boolean
          readOnly: true
        background_image:
          title: Background image
          type: string
          readOnly: true
          format: uri
        rating:
          title: Rating
          type: number
        rating_top:
          title: Rating top
          type: integer
          readOnly: true
        ratings:
          title: Ratings
          type: object
          readOnly: true
        ratings_count:
          title: Ratings count
          type: integer
          readOnly: true
        reviews_text_count:
          title: Reviews text count
          type: string
          readOnly: true
        added:
          title: Added
          type: integer
          readOnly: true
        added_by_status:
          title: Added by status
          type: object
          readOnly: true
        metacritic:
          title: Metacritic
          type: integer
          readOnly: true
        playtime:
          title: Playtime
          description: in hours
