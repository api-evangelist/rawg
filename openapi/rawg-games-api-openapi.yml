      description: ''
      parameters:
      - name: id
        in: path
        description: An ID or a slug identifying this Game.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
      tags:
