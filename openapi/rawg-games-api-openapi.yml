  /games/{id}/reddit:
    parameters:
    - name: id
      in: path
      description: A unique integer value identifying this Game.
      required: true
      schema:
        type: integer
    get:
      operationId: games_reddit_read
      summary: Get a list of most recent posts from the game's subreddit
      description: ''
      parameters:
      - name: id
        in: path
        description: An ID or a slug identifying this Game.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reddit'
      tags:
      - Games
  /games/{id}/suggested:
    parameters:
    - name: id
      in: path
      description: A unique integer value identifying this Game.
      required: true
      schema:
        type: integer
    get:
      operationId: games_suggested_read
      summary: Get a list of visually similar games, available only for business and…
      description: ''
      parameters:
      - name: id
        in: path
        description: An ID or a slug identifying this Game.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
